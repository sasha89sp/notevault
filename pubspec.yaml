name: notevault
description: Cross-platform Markdown notes with WebDAV sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2
  flutter_quill: ^10.8.5
  file_picker_cross: ^4.4.3
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  printing: ^5.13.1
  pdf: ^3.11.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  archive: ^3.6.1
  xml: ^6.5.0
  path: ^1.9.0
  crypto: ^3.0.5
  convert: ^3.1.1
  equatable: ^2.1.3
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3
  flutter_slidable: ^3.1.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
